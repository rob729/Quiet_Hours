apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'kotlin-parcelize'
apply plugin: "androidx.navigation.safeargs.kotlin"
apply plugin: 'com.google.dagger.hilt.android'
apply plugin: 'com.google.devtools.ksp'


android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "com.rob729.quiethours"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 10
        versionName "2.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding = true
    }
    namespace 'com.rob729.quiethours'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.abdularis:CircularImageView:1.5'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Lottie Animation Library
    implementation "com.airbnb.android:lottie:6.6.7"

    // App Intro Library
    implementation 'com.github.AppIntro:AppIntro:6.0.0'

    // material design library
    implementation 'com.google.android.material:material:1.12.0'

    // Room components
    implementation 'androidx.room:room-runtime:2.7.2'
    ksp 'androidx.room:room-compiler:2.7.2'
    androidTestImplementation 'androidx.room:room-testing:2.7.2'

    //  for navigation components
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.3" // For Kotlin use navigation-fragment-ktx
    implementation "androidx.navigation:navigation-ui-ktx:2.9.3" // For Kotlin use navigation-ui-ktx

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.2'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    // for GSON
    implementation 'com.google.code.gson:gson:2.13.1'

    //for WorkManager
    implementation "androidx.work:work-runtime-ktx:2.10.3"

    implementation "androidx.preference:preference-ktx:1.2.1"

    //for hilt(DI)
    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-compiler:$hilt_version"
    implementation "androidx.hilt:hilt-work:1.2.0"
    ksp 'androidx.hilt:hilt-compiler:1.2.0'

    implementation 'com.google.devtools.ksp:symbol-processing-api:2.2.0-2.0.2'

    implementation 'com.google.android.play:app-update:2.1.0'

    implementation project(':datepicker')
}
